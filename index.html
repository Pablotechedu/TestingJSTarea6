<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanzador de Dados Virtual</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Juego de Dados</h1>

      <!-- Input para ingresar el nombre -->
      <label for="name">Ingresa tu nombre:</label>
      <input type="text" id="name" placeholder="Escribe tu nombre..." />
      <button onclick="saveName()">Guardar Nombre</button>

      <p id="greeting"></p>

      <!-- Botón para lanzar los dados -->
      <button onclick="rollDice()">Lanzar Dados</button>

      <!-- Sección para mostrar los resultados -->
      <p id="dice-results"></p>
      <p id="game-result"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
